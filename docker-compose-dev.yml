name: user_service_dev

services:
  db:
    image: postgres:15.15-alpine
    container_name: user-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - user_postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: user-service-local
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=user_db
      - SECRET_KEY=dev_secret_key_change_me_in_prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  user_postgres_data_local: