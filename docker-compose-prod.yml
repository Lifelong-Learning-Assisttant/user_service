version: "3.8"

services:
  db:
    image: postgres:15.15-alpine
    container_name: user-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - user_service_network

  api:
    image: ghcr.io/lifelong-learning-assisttant/user_service:v001
    container_name: user-service-prod
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=user_db
      - SECRET_KEY=${SECRET_KEY:-prod_secret_key_change_me}
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      web_ui_network:
        aliases:
          - user_service
      user_service_network:

networks:
  web_ui_network:
    name: web_ui_network
    external: true
  user_service_network:
    name: user_service_network
    external: true

volumes:
  user_postgres_data:
    external: true
